name: Nightly mutation tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  server-mutation:
    name: Server mutation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npx c8 --reporter=lcov npm test
        working-directory: server
      - name: Run mutation tests
        id: stryker
        run: npx stryker run
        working-directory: server
        continue-on-error: true  # exits 1 when mutants survive; report files are still written
      - name: Collect server reports
        if: always()
        run: |
          mkdir -p artifacts
          if [ -f server/coverage/lcov.info ]; then cp server/coverage/lcov.info artifacts/lcov.info; fi
          if [ -f server/reports/mutation/mutation.json ]; then cp server/reports/mutation/mutation.json artifacts/mutation.json; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-reports
          path: artifacts/

  client-mutation:
    name: Client mutation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm install
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run test:coverage
        working-directory: client
      - name: Run mutation tests
        id: stryker
        run: npx stryker run
        working-directory: client
        continue-on-error: true  # exits 1 when mutants survive; report files are still written
      - name: Collect client reports
        if: always()
        run: |
          mkdir -p artifacts
          if [ -f client/reports/coverage/lcov.info ]; then cp client/reports/coverage/lcov.info artifacts/lcov.info; fi
          if [ -f client/reports/mutation/mutation.json ]; then cp client/reports/mutation/mutation.json artifacts/mutation.json; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: client-reports
          path: artifacts/

  tqa:
    name: Test Quality Analysis
    runs-on: ubuntu-latest
    needs: [server-mutation, client-mutation]
    if: always()  # run even if a mutation job fails — report on whatever data was collected
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: server-reports
          path: reports/server
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: client-reports
          path: reports/client
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: pip install git+https://github.com/hobsojam/test-analysis.git@main
      # Generate a runtime config including only the sources that were actually
      # produced.  A component is omitted entirely if its lcov file is absent
      # (no point showing an empty section); stryker is omitted per-component
      # when the mutation run crashed before writing its report.
      - name: Generate runtime TQA config
        run: |
          {
            if [ -f reports/server/lcov.info ]; then
              echo '[components.server]'
              echo 'lcov = "reports/server/lcov.info"'
              if [ -f reports/server/mutation.json ]; then echo 'stryker = "reports/server/mutation.json"'; fi
              echo ''
            fi
            if [ -f reports/client/lcov.info ]; then
              echo '[components.client]'
              echo 'lcov = "reports/client/lcov.info"'
              if [ -f reports/client/mutation.json ]; then echo 'stryker = "reports/client/mutation.json"'; fi
            fi
          } > tqa-runtime.toml
      - run: tqa analyze --config tqa-runtime.toml --format github > tqa-summary.md
        continue-on-error: true
      - run: cat tqa-summary.md >> $GITHUB_STEP_SUMMARY
