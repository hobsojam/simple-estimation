name: Nightly mutation tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  server-mutation:
    name: Server mutation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npx c8 --reporter=lcov npm test
        working-directory: server
      - run: npx stryker run
        working-directory: server
      - name: Collect server reports
        run: |
          mkdir -p artifacts
          cp server/coverage/lcov.info artifacts/lcov.info
          cp server/reports/mutation/mutation.json artifacts/mutation.json
      - uses: actions/upload-artifact@v7
        with:
          name: server-reports
          path: artifacts/

  client-mutation:
    name: Client mutation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm install
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run test:coverage
        working-directory: client
      - run: npx stryker run
        working-directory: client
      - name: Collect client reports
        run: |
          mkdir -p artifacts
          cp client/reports/coverage/lcov.info artifacts/lcov.info
          cp client/reports/mutation/mutation.json artifacts/mutation.json
      - uses: actions/upload-artifact@v7
        with:
          name: client-reports
          path: artifacts/

  tqa:
    name: Test Quality Analysis
    runs-on: ubuntu-latest
    needs: [server-mutation, client-mutation]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          name: server-reports
          path: reports/server
      - uses: actions/download-artifact@v8
        with:
          name: client-reports
          path: reports/client
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: pip install git+https://github.com/hobsojam/test-analysis.git@main
      - run: tqa analyze --config tqa.toml --format github > tqa-summary.md
      - run: cat tqa-summary.md >> $GITHUB_STEP_SUMMARY
