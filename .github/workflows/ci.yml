name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  server-test:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npx c8 --reporter=lcov npm test
        working-directory: server
      - name: Collect server reports
        run: |
          mkdir -p artifacts
          cp server/coverage/lcov.info artifacts/lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: server-reports
          path: artifacts/

  client-build:
    name: Client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm install
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run test:coverage
        working-directory: client
      - run: npm run build
        working-directory: client
      - name: Collect client reports
        run: |
          mkdir -p artifacts
          cp client/reports/coverage/lcov.info artifacts/lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: client-reports
          path: artifacts/

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [server-test, client-build, e2e]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: server-reports
          path: reports/server
      - uses: actions/download-artifact@v8
        with:
          name: client-reports
          path: reports/client
      - uses: actions/download-artifact@v8
        with:
          name: e2e-reports
          path: reports/e2e
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [server-test, client-build]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm install
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - name: Convert E2E results to SonarQube format
        if: always()
        run: node convert-to-sonar.mjs e2e-results.json sonar-e2e.xml e2e/
        working-directory: e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-reports
          path: e2e/sonar-e2e.xml
