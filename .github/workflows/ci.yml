name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  server-test:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npx c8 --reporter=lcov node --test test/rooms.test.js test/handlers.test.js test/api.test.js test/sanitize.test.js
        working-directory: server
      - run: npx stryker run
        working-directory: server
      - uses: actions/upload-artifact@v4
        with:
          name: server-reports
          path: |
            server/coverage/lcov.info
            server/reports/mutation/mutation.json

  client-build:
    name: Client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm install
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npx stryker run
        working-directory: client
      - run: npm run build
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: client-reports
          path: client/reports/mutation/mutation.json

  tqa:
    name: Test Quality Analysis
    runs-on: ubuntu-latest
    needs: server-test
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: server-reports
          path: reports
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install git+https://github.com/hobsojam/test-analysis.git@main
      - run: |
          LCOV=$(find reports -name "lcov.info" | head -1)
          STRYKER=$(find reports -name "mutation.json" | head -1)
          tqa analyze \
            ${LCOV:+--lcov "$LCOV"} \
            ${STRYKER:+--stryker "$STRYKER"} \
            --format github > tqa-summary.md
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        run: |
          COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/${{ github.event.number }}/comments \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("# TQA Report Summary"))) | .id] | last // empty')
          if [ -n "$COMMENT_ID" ]; then
            gh api repos/${{ github.repository }}/issues/comments/"$COMMENT_ID" \
              -X PATCH -f body="$(cat tqa-summary.md)"
          else
            gh api repos/${{ github.repository }}/issues/${{ github.event.number }}/comments \
              -X POST -f body="$(cat tqa-summary.md)"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [server-test, client-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm install
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
