name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  server-test:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npx c8 --reporter=lcov node --test test/rooms.test.js test/handlers.test.js test/api.test.js test/sanitize.test.js test/sweep.test.js test/ws.test.js
        working-directory: server
      - run: npx stryker run
        working-directory: server
      - name: Collect server reports
        run: |
          mkdir -p artifacts
          cp server/coverage/lcov.info artifacts/lcov.info
          cp server/reports/mutation/mutation.json artifacts/mutation.json
      - uses: actions/upload-artifact@v4
        with:
          name: server-reports
          path: artifacts/

  client-build:
    name: Client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm install
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run test:coverage
        working-directory: client
      - run: npx stryker run
        working-directory: client
      - run: npm run build
        working-directory: client
      - name: Collect client reports
        run: |
          mkdir -p artifacts
          cp client/reports/coverage/lcov.info artifacts/lcov.info
          cp client/reports/mutation/mutation.json artifacts/mutation.json
      - uses: actions/upload-artifact@v4
        with:
          name: client-reports
          path: artifacts/

  tqa:
    name: Test Quality Analysis
    runs-on: ubuntu-latest
    needs: [server-test, client-build]
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: server-reports
          path: reports/server
      - uses: actions/download-artifact@v4
        with:
          name: client-reports
          path: reports/client
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install git+https://github.com/hobsojam/test-analysis.git@main
      - run: tqa analyze --config tqa.toml --format github > tqa-summary.md
      - run: cat tqa-summary.md >> $GITHUB_STEP_SUMMARY
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        run: |
          COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/${{ github.event.number }}/comments \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("# TQA Report Summary"))) | .id] | last // empty')
          if [ -n "$COMMENT_ID" ]; then
            gh api repos/${{ github.repository }}/issues/comments/"$COMMENT_ID" \
              -X PATCH -f body="$(cat tqa-summary.md)"
          else
            gh api repos/${{ github.repository }}/issues/${{ github.event.number }}/comments \
              -X POST -f body="$(cat tqa-summary.md)"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [server-test, client-build, e2e]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: server-reports
          path: reports/server
      - uses: actions/download-artifact@v4
        with:
          name: client-reports
          path: reports/client
      - uses: actions/download-artifact@v4
        with:
          name: e2e-reports
          path: reports/e2e
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [server-test, client-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm install
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - name: Convert E2E results to SonarQube format
        if: always()
        run: node convert-to-sonar.mjs e2e-results.json sonar-e2e.xml e2e/
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: e2e/sonar-e2e.xml
